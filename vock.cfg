# vock.cfg

[general]
# Set your default language.
# Options: arpabet, english, spanish, russian, german, italian, french, hungarian, polish, portuguese, czech
language = arpabet

# Root folder that all paths below are resolved against. Defaults to "./"
# (this folder). Point it at another project's folder to run the pipeline
# against that project.
project_root = ../vock-fo2/

[paths]
# Set the paths to the file structure, relative to project_root.
msg         = ./msg
tag         = ./tag
audio       = ./audio
txt         = ./txt
wav         = ./wav
acm         = ./acm
textgrid    = ./textgrid
lip         = ./lip
dat         = ./dat/vock.dat
float_dat   = ./dat/vock_floats.dat
loc         = ./loc
scripts     = ./scripts
scripts_src = ./scripts_src
snd2acm     = ./snd2acm.exe
npc_filter   = ./npc_filter.cfg
float_filter = ./float_filter.cfg
mfa_lock     = ./mfa_lock.cfg
characters   = ./characters.py

# RPU repo paths (relative to this vock.cfg's own folder, NOT project_root --
# the RPU repo is a sibling of vock/ itself, shared across whichever project
# project_root points at). Used by tools/vock_tag.py and tools/msg_localize.py.
rpu_scripts_src = ../rpu/scripts_src
rpu_text        = ../rpu/data/text

[settings]
mfa_env = aligner   # Set the MFA environment
lufs    = -16.0     # Set the LUFS for audio normalization
no_norm = false     # Normalization enabled
